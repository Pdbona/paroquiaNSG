name: Deploy ejc-app-cronograma

# Este repositório é um monorepo com um app por subpasta (padrão SBS). Este
# workflow cuida só de ejc-app-cronograma/ — só dispara quando algo muda ali
# dentro, e publica no gh-pages branch DENTRO da subpasta ejc-app-cronograma/
# (destination_dir + keep_files), pra não apagar outros apps que já estejam
# publicados no mesmo branch (ex: ejc-app-doacoes).

on:
  push:
    branches: [main, master]
    paths:
      - 'ejc-app-cronograma/**'
      - '.github/workflows/deploy-cronograma.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ejc-app-cronograma/**'
  # Permite disparar manualmente pela aba Actions (ou via API) quando um push
  # não aciona o workflow sozinho por algum motivo.
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ejc-app-cronograma

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ejc-app-cronograma/package-lock.json

      - name: Instalar dependências
        run: npm install

      # As chaves precisam existir aqui: o Create React App grava o valor das
      # variáveis REACT_APP_* dentro do bundle no momento do build. Sem elas o
      # app publicado abre na tela "Firebase ainda não configurado".
      # Mesmo projeto Firebase do ejc-app-doacoes (paroquiansg-2f648) — os
      # secrets já cadastrados em Settings > Secrets and variables > Actions
      # servem pra este app também, não precisa recadastrar.
      #
      # CI: false é obrigatório — sem isso, qualquer warning do ESLint (ex:
      # variável não usada) vira erro e quebra o build no GitHub Actions
      # (localmente não quebra, só lá, porque o runner seta CI=true sozinho).
      - name: Montar o app
        run: npm run build
        env:
          CI: false
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}

      # Publica só quando o commit entra na branch principal; em pull request
      # o job para no build, que já serve de conferência.
      # destination_dir + keep_files: publica dentro de /ejc-app-cronograma/
      # no branch gh-pages, sem apagar as pastas de outros apps do EJC que
      # estejam publicadas no mesmo branch.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ejc-app-cronograma/build
          destination_dir: ejc-app-cronograma
          keep_files: true
